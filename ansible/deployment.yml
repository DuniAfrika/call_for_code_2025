- name: Deploy Python App to Ubuntu
  hosts: ubuntu
  become: yes

  vars:
    app_dir: /opt/myapp

  tasks:
    - name: Ensure Python3 and pip3 are installed
      apt:
        name: "{{ item }}"
        state: present
        update_cache: yes
      loop:
        - python3
        - python3-pip

    - name: Create app directory
      file:
        path: "{{ app_dir }}"
        state: directory
        mode: 0755

    - name: Copy app files
      copy:
        src: myapp/
        dest: "{{ app_dir }}"

    - name: Install Python dependencies
      pip:
        requirements: "{{ app_dir }}/requirements.txt"
        executable: pip3

    - name: Run app temporarily
      shell: python3 app.py
      args:
        chdir: "{{ app_dir }}"
      async: 30
      poll: 0

